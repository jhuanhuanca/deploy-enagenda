server {
    listen 80;
    listen [::]:80;
    server_name enagenda.techrep.app;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://enagenda.techrep.app$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name enagenda.techrep.app;

    root /var/www/enagenda/front-plataforma/dist;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/enagenda.techrep.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/enagenda.techrep.app/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:EnagendaSSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
