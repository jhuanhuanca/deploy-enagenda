server {
    listen 80;
    listen [::]:80;
    server_name adgenda.techrep.app;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://adgenda.techrep.app$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name adgenda.techrep.app;

    ssl_certificate /etc/letsencrypt/live/adgenda.techrep.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/adgenda.techrep.app/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:AdgendaSSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;

    client_max_body_size 8m;

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
