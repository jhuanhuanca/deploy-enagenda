# Sustituye estas directivas en /etc/redis/redis.conf.
# No las dejes duplicadas: Redis falla o se queda con el primer valor.
# La política noeviction es obligatoria: allkeys-lru borraría trabajos de la cola.

bind 127.0.0.1 -::1
protected-mode yes
port 6379
requirepass CAMBIAR_POR_LA_CLAVE_DE_REDIS
maxmemory 256mb
maxmemory-policy noeviction
appendonly yes
appendfsync everysec
save 900 1
save 300 10
save 60 10000
