[program:enagenda-horizon]
process_name=%(program_name)s
command=/usr/bin/php /var/www/enagenda/backend-politica/artisan horizon
directory=/var/www/enagenda/backend-politica
user=www-data
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=3600
redirect_stderr=true
stdout_logfile=/var/log/enagenda/horizon.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5

[program:enagenda-scheduler]
process_name=%(program_name)s
command=/usr/bin/php /var/www/enagenda/backend-politica/artisan schedule:work
directory=/var/www/enagenda/backend-politica
user=www-data
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=60
redirect_stderr=true
stdout_logfile=/var/log/enagenda/scheduler.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5

[program:enagenda-admin]
process_name=%(program_name)s
command=/usr/local/bin/deno task start
directory=/var/www/enagenda/admin-panel/admin
user=www-data
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=20
environment=ADMIN_API_URL="https://eagapi.techrep.app",ADMIN_COOKIE_SECURE="true"
redirect_stderr=true
stdout_logfile=/var/log/enagenda/admin.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
